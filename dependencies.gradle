dependencies {
    devOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.114-GTNH:dev")

    // GTNHLib provides fastutil (it.unimi.dsi.fastutil) on the compile/runtime classpath.
    api("com.github.GTNewHorizons:GTNHLib:0.11.31")

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    // GTNHLib's transitive fastutil only reaches testCompileClasspath, not testRuntimeClasspath
    // under the gtnhconvention plugin's sourceset wiring; pin it explicitly for the test runtime.
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.18'

    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.1.56:dev")
}
